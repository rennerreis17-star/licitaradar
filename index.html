<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LicitaRadar — Painel de Licitações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --ink:#0f1b2d; --muted:#5b6b82; --line:#e3e8f0;
  --nav:#0b1f3a; --nav2:#12305a; --accent:#0e9f6e; --accent2:#0b7f58; --blue:#2563eb;
  --warn:#d97706; --bad:#dc2626; --ok:#059669; --chip:#eef2f8; --shadow:0 1px 2px rgba(15,27,45,.06),0 4px 16px rgba(15,27,45,.05);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
a{color:var(--blue)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:248px;flex-shrink:0;background:linear-gradient(180deg,var(--nav),var(--nav2));color:#dbe6f5;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:11px;color:#9fb3cf;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#c9d6ea;text-decoration:none;font-weight:500;cursor:pointer;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(14,159,110,.18);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.side .foot{margin-top:auto;font-size:11.5px;color:#8ea4c4;padding:10px}
.side .foot b{color:#cfe0f5}
/* Main */
main{flex:1;min-width:0;padding:26px 32px 60px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:24px;margin:0;letter-spacing:-.4px}
.top p{margin:3px 0 0;color:var(--muted)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15.5px;margin:0 0 12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h3{font-size:14px;margin:16px 0 8px}
.kpi .lbl{color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:4px}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,159,110,.15);background:#fff}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.row>.fit{flex:0 0 auto;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--accent2)}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--chip)}
.btn.ghost{background:transparent;color:var(--muted);padding:6px 10px}
.btn.ghost:hover{background:var(--chip);color:var(--ink)}
.btn.danger{background:#fff;color:var(--bad);border-color:#f3c9c9}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:wait}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:600;color:#334760;white-space:nowrap}
.chip.ok{background:#dcfce7;color:#166534}.chip.bad{background:#fee2e2;color:#991b1b}.chip.warn{background:#fef3c7;color:#92400e}.chip.blue{background:#dbeafe;color:#1e40af}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);background:#f8fafc}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px;background:#fbfcfe}
.list .it{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.list .it:last-child{border-bottom:0}
.it .t{font-weight:600}
.dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;word-break:break-word}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.flag{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin:6px 0;font-size:13.5px}
.flag.bad{background:#fef2f2;border:1px solid #fecaca}.flag.warn{background:#fffbeb;border:1px solid #fde68a}.flag.ok{background:#f0fdf4;border:1px solid #bbf7d0}.flag.info{background:#eff6ff;border:1px solid #bfdbfe}
.md{font-size:14px;line-height:1.6}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 8px;line-height:1.3}
.md h1{font-size:20px}.md h2{font-size:17px}.md h3{font-size:15px}
.md table{margin:10px 0;border:1px solid var(--line)}
.md td,.md th{border:1px solid var(--line)}
.md blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--accent);background:#f6fbf9}
.md code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12.5px}
.out{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff;max-height:none}
.drop{border:1.5px dashed #b9c6d8;border-radius:12px;padding:16px;text-align:center;background:#fbfcfe;cursor:pointer}
.drop:hover{border-color:var(--accent);background:#f3fbf8}
.progress{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f1b2d;color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:16px;padding:22px;width:min(720px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:18px}
.right{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.score{font-weight:800;font-size:12px;padding:3px 8px;border-radius:7px}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.btn.sec .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;margin-bottom:18px;font-size:13.5px}
.pill-status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.stack>*+*{margin-top:16px}
.hide{display:none!important}
.top .row>.tabs{flex:0 0 auto;min-width:0;flex-wrap:nowrap}.top .row>.tabs button{padding:7px 12px}.top .row>.btn{flex:0 0 auto;min-width:0}
body.fonteG main{zoom:1.12}
body.dark{--bg:#0d1522;--card:#142033;--ink:#e6edf7;--muted:#93a4bd;--line:#24344d;--chip:#1d2c43;color-scheme:dark}
body.dark input,body.dark select,body.dark textarea{background:#0f1a2b;color:var(--ink);border-color:var(--line)}
body.dark th{background:#18263b}body.dark .drop,body.dark .empty{background:#111c2d;border-color:#2a3d59}
body.dark .tabs button{background:#142033;color:var(--muted);border-color:var(--line)}body.dark .tabs button.on{background:#e6edf7;color:#0d1522}
body.dark .btn.sec{background:#1a2840;color:var(--ink);border-color:var(--line)}body.dark .btn.danger{background:#2a1416}
body.dark .flag.ok{background:#0f2a1f;border-color:#1f5a3f}body.dark .flag.warn{background:#2b2210;border-color:#5c4718}body.dark .flag.bad{background:#2d1517;border-color:#6b2a2e}body.dark .flag.info{background:#10223d;border-color:#24477a}
body.dark .chip{color:#c9d6ea}body.dark .chip.ok{background:#0f3a26;color:#86efac}body.dark .chip.bad{background:#3d1517;color:#fca5a5}body.dark .chip.warn{background:#3a2c0c;color:#fcd34d}body.dark .chip.blue{background:#13284d;color:#93c5fd}
body.dark .kcol{background:#101b2c}body.dark .kcard,body.dark .out,body.dark .modal,body.dark .ob-card,body.dark .ob-chip{background:#142033;color:var(--ink)}body.dark .ob-emp{background:#0f2a1f;border-color:#1f5a3f}
body.dark .cal-d{background:#111c2d}body.dark .cal-d.nutil{background:#0e1726;color:#4a5b75}body.dark .md blockquote{background:#0f2a1f}
body.dark .card[style*="linear-gradient"]{background:#142033!important}

.certrow{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
/* nav com nomes */
.nav a .ns{display:none}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x proximity}
.kcol{flex:0 0 260px;background:#eef2f8;border-radius:14px;padding:10px;scroll-snap-align:start}
.khead{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.klist{min-height:60px;display:flex;flex-direction:column;gap:8px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;cursor:pointer;box-shadow:0 1px 2px rgba(15,27,45,.05)}
.kcard:active{transform:scale(.98)}.kghost{opacity:.4}
.ckrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);margin:0;font-weight:500;color:var(--ink);font-size:14px}
.ckrow input{width:20px;height:20px;flex-shrink:0;accent-color:var(--accent)}.ckrow span{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-h{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-d{aspect-ratio:1;border-radius:10px;background:#f8fafc;border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;font-weight:600;cursor:default}
.cal-d.vazio{background:transparent;border:0}.cal-d.nutil{color:#a0aec0;background:#fbfcfe}.cal-d.hoje{border:2px solid var(--accent);color:var(--accent)}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap}.cal-dots i,i.lg{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-imp{background:var(--warn)}.dot-ses{background:var(--blue)}.dot-rec{background:var(--bad)}.dot-con{background:#64748b}.dot-doc{background:#a855f7}
.bar{height:8px;background:var(--chip);border-radius:9px;min-width:80px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.platrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.platrow>div{flex:1;min-width:150px}
.progress i.indet{width:40%;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{margin-left:-40%}100%{margin-left:100%}}

.ob-bg{position:fixed;inset:0;z-index:95;background:radial-gradient(1200px 700px at 10% 110%,rgba(14,159,110,.35),transparent),linear-gradient(160deg,#0b1f3a,#12305a);display:grid;place-items:center;padding:16px;overflow:auto;animation:obIn .35s ease}
.ob-card{background:#fff;border-radius:22px;padding:26px 22px;width:min(480px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:obUp .4s ease}
.logo-big{width:76px;height:76px;border-radius:22px;background:var(--accent);display:grid;place-items:center;margin:0 auto;box-shadow:0 10px 30px rgba(14,159,110,.45)}
.ob-feat{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-top:8px}.ob-feat>div:first-child{font-size:22px}
.ob-emp{margin-top:14px;padding:14px;border-radius:14px;background:#f0fdf4;border:1px solid #bbf7d0;animation:obUp .3s ease}
.ob-chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.ob-chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rcard{transition:transform .15s,box-shadow .15s}.rcard:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(15,27,45,.1)}
@keyframes obIn{from{opacity:0}to{opacity:1}}@keyframes obUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:auto;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:8px 10px;overflow-x:auto;gap:2px}
  .brand{padding:0 8px 0 2px}.brand small,.brand span.nm{display:none}
  .nav{display:flex;gap:0}.nav a{flex-direction:column;gap:3px;padding:7px 8px 6px;font-size:10.5px;min-width:58px;box-shadow:none!important}.nav a .nl{display:none}.nav a .ns{display:block;font-weight:600;letter-spacing:.1px}.nav a.on{background:rgba(14,159,110,.22)}.nav a svg{width:20px;height:20px}
  .kcol{flex-basis:78vw}
  .side .foot{display:none}
  main{padding:18px 14px 50px}
  .g3,.g2{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr;gap:10px}.kpi .val{font-size:24px}.card.kpi{padding:14px}
  .dl{grid-template-columns:1fr}.dl dt{margin-top:6px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/><path d="M8 11l2 2 4-4"/></svg></div><div><span class="nm">LicitaRadar</span><small>Licitações · Lei 14.133/2021</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Dados salvos <b>neste aparelho</b>.<br>Faça backup em Ajustes → Dados.</div>
  </aside>
  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
/* =========================================================
   LicitaRadar — painel de licitações (arquivo único)
   Fontes: BrasilAPI / Minha Receita / CNPJ.ws (dados abertos da Receita Federal)
           PNCP — API de Consultas (pncp.gov.br/api/consulta)
   ========================================================= */
const VERSAO = "1.3";
const STORE_KEY = "licitaradar_v1";

/* ---------------- Estado ---------------- */
const vazio = () => ({
  cfg:{apiKey:"",modelo:"claude-sonnet-5-5",perfil:{},pinHash:"",autoBloq:"0",tema:"claro",fonte:"normal",inicio:"painel",alertaDias:"20",ultimoBackup:""},
  empresa:{cnpj:"",dados:null,palavras:"",plataformas:{},docs:[],atestados:[],fin:{pl:"",capital:"",lg:"",sg:"",lc:"",faturamento:""},registros:"",obs:""},
  licitacoes:[], concorrentes:[], radar:{palavras:"",uf:"",mun:"",modalidade:"",dias:"30",vmin:"",ordem:"ader",paginas:"3",ultimos:[]}, intro:false
});
let S = vazio();
try{ const raw = localStorage.getItem(STORE_KEY); if(raw) S = Object.assign(vazio(), JSON.parse(raw)); }catch(e){}
S.cfg=Object.assign(vazio().cfg,S.cfg||{}); S.empresa.plataformas=S.empresa.plataformas||{}; S.radar=Object.assign(vazio().radar,S.radar||{});
function salvar(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){ toast("Não consegui salvar neste navegador — faça backup em Configurações."); } }

let sampleFn = null;
(async()=>{ try{ if(window.claude && window.claude.use){ sampleFn = await window.claude.use("sample"); if(sampleFn) render(); } }catch(e){} })();

/* ---------------- Utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const soDig = s => String(s||"").replace(/\D/g,"");
function fmtCNPJ(c){ c=soDig(c).padStart(14,"0"); return c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5"); }
function cnpjValido(c){
  c=soDig(c); if(c.length!==14 || /^(\d)\1+$/.test(c)) return false;
  const calc = n => { let s=0,p=n-7; for(let i=0;i<n;i++){ s+= +c[i]*p--; if(p<2)p=9; } const r=s%11; return r<2?0:11-r; };
  return calc(12)===+c[12] && calc(13)===+c[13];
}
const brl = v => (v===null||v===undefined||v==="")?"—":Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:2});
const parseD=d=>(typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d))?new Date(d+"T12:00:00"):new Date(d);
function fmtData(d){ if(!d) return "—"; const x=parseD(d); if(isNaN(x)) return String(d); return x.toLocaleDateString("pt-BR"); }
function fmtDataHora(d){ if(!d) return "—"; const x=new Date(d); if(isNaN(x)) return String(d); return x.toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}); }
function diasAte(d){ if(!d) return null; const x=parseD(d); if(isNaN(x)) return null; const h=new Date(); h.setHours(0,0,0,0); const y=new Date(x); y.setHours(0,0,0,0); return Math.round((y-h)/864e5); }
function semAcento(s){ return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
const STOP = new Set("para com sem sobre entre pela pelo pelos pelas este esta esse essa como mais menos todo toda todos todas outros outras outro outra demais servicos servico aquisicao contratacao empresa especializada fornecimento eventual futura registro precos preco item itens lote lotes atender necessidades conforme termo referencia edital anexo municipio municipal estado estadual secretaria prefeitura atraves demanda forma objeto destinados destinado destinadas visando visto quando onde cujo cuja suas seus pelo nao".split(" "));
function tokens(s){ return semAcento(s).split(/[^a-z0-9]+/).filter(w=>w.length>=4 && !STOP.has(w)); }
function raiz(w){ return w.length>6 ? w.slice(0,6) : w; }
function toast(msg,ms=3200){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),ms); }
function modal(html,onMount){ const l=$("#layer"); l.innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`; l.querySelector(".modal-bg").addEventListener("click",e=>{ if(e.target.classList.contains("modal-bg")) fecharModal(); }); onMount && onMount(l.querySelector(".modal")); }
function fecharModal(){ $("#layer").innerHTML=""; }
function confirmar(msg, ok){ modal(`<h2>Confirmar</h2><p>${esc(msg)}</p><div class="right"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn danger" id="cOk">Confirmar</button></div>`, m=>m.querySelector("#cOk").onclick=()=>{fecharModal();ok();}); }
async function copiar(texto){
  try{ await navigator.clipboard.writeText(texto); toast("Copiado ✔"); return true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=texto; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); toast(ok?"Copiado ✔":"Não consegui copiar automaticamente — selecione o texto e copie."); return ok; }
}
let dlFn=null;
(async()=>{ try{ if(window.claude && window.claude.use){ dlFn = await window.claude.use("downloads"); } }catch(e){} })();
async function baixar(nome, conteudo, tipo){
  if(dlFn){
    try{ await dlFn.save({filename:nome,data:conteudo}); return; }
    catch(e){ try{ await dlFn.save({filename:nome,data:new Blob([conteudo],{type:tipo})}); return; }catch(e2){ toast("Download não autorizado — use o botão Copiar."); return; } }
  }
  try{ const b=new Blob([conteudo],{type:tipo}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast("Download iniciado. Se nada aconteceu, use o botão Copiar."); }
  catch(e){ toast("Download bloqueado aqui — use Copiar."); }
}
async function fetchJSON(url, ms=45000){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),ms);
  try{ const r=await fetch(url,{signal:ctl.signal,headers:{accept:"application/json"}}); clearTimeout(t);
    if(r.status===204) return {__vazio:true};
    if(!r.ok){ const e=new Error("HTTP "+r.status); e.status=r.status; throw e; }
    return await r.json();
  }catch(e){ clearTimeout(t); throw e; }
}

async function consultarCNPJ(cnpj){
  cnpj=soDig(cnpj);
  const fontes=[
    ["BrasilAPI", ()=>fetchJSON(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`,20000).then(d=>normBrasilAPI(d,"BrasilAPI"))],
    ["Minha Receita", ()=>fetchJSON(`https://minhareceita.org/${cnpj}`,20000).then(d=>normBrasilAPI(d,"Minha Receita"))],
    ["CNPJ.ws", ()=>fetchJSON(`https://publica.cnpj.ws/cnpj/${cnpj}`,20000).then(normCnpjWs)]
  ];
  const erros=[];
  for(const [nome,fn] of fontes){
    try{ const r=await fn(); if(r && r.razao) return r; erros.push(nome+": vazio"); }
    catch(e){ if(e.status===404) throw new Error("CNPJ não encontrado na base da Receita."); erros.push(nome+": "+(e.message||"falhou")); }
  }
  const err=new Error("bloqueado"); err.detalhes=erros; throw err;
}

/* ---------------- Alertas de flags (concorrentes) ---------------- */
function anosDesde(d){ const x=new Date(d); if(isNaN(x)) return null; return (Date.now()-x)/(365.25*864e5); }
function flagsEmpresa(d, objetoRef){
  const f=[];
  if(!d) return f;
  if(d.situacao && !/ativa/i.test(d.situacao)) f.push(["bad",`Situação cadastral: <b>${esc(d.situacao)}</b>${d.motivoSituacao?" ("+esc(d.motivoSituacao)+")":""}. Empresa não ativa não pode ser habilitada.`]);
  if(d.situacaoEspecial) f.push(["bad",`Situação especial na Receita: <b>${esc(d.situacaoEspecial)}</b> (ex.: recuperação judicial/falência). Conferir a certidão de falência exigida no edital.`]);
  const a=anosDesde(d.abertura);
  if(a!==null && a<1) f.push(["warn",`Empresa aberta há menos de 1 ano (${fmtData(d.abertura)}). Verifique se apresentou balanço válido (art. 69 §6º permite balanço de abertura) e se os atestados técnicos são compatíveis com tão pouco tempo.`]);
  if(d.mei===true) f.push(["warn","Empresa é <b>MEI</b>. Conferir limites de faturamento, capacidade operacional e se o objeto é compatível."]);
  if(/micro|pequeno|epp|me\b/i.test(d.porte||"")) f.push(["info",`Porte declarado na Receita: <b>${esc(d.porte)}</b>. Se usou benefício ME/EPP (LC 123), vale checar se o faturamento do ano não ultrapassou o limite (art. 4º §§2º-3º da Lei 14.133).`]);
  if(objetoRef){
    const sc=compatCNAE(objetoRef,d);
    if(sc.nivel==="Baixa") f.push(["warn",`CNAEs com <b>baixa aderência</b> ao objeto informado. Conferir se o objeto social (contrato social) é compatível com o objeto da licitação — habilitação jurídica.`]);
    else f.push(["ok",`CNAEs com aderência <b>${sc.nivel.toLowerCase()}</b> ao objeto (${sc.pts} termos em comum).`]);
  }
  if(d.capital!==undefined && d.capital!==null) f.push(["info",`Capital social: <b>${brl(d.capital)}</b>. Se o edital exige capital mínimo ou PL (até 10% do valor estimado — art. 69 §4º), compare.`]);
  return f;
}
function compatCNAE(objeto, d, palavrasExtra=""){
  const obj=new Set(tokens(objeto).map(raiz));
  const base=[d?.cnaePrincipal?.descricao, ...(d?.cnaesSec||[]).map(c=>c.descricao)].join(" ");
  const tk=new Set(tokens(base).map(raiz));
  const extra=new Set(tokens(palavrasExtra).map(raiz));
  let pts=0; const hits=[];
  obj.forEach(w=>{ if(extra.has(w)){pts+=2;hits.push(w);} else if(tk.has(w)){pts+=1;hits.push(w);} });
  const nivel = pts>=4?"Alta":pts>=2?"Média":"Baixa";
  return {pts,nivel,hits};
}
function sociosEmComum(){
  const mapa={};
  S.concorrentes.forEach(c=>(c.dados?.socios||[]).forEach(s=>{ const k=semAcento(s.nome).trim(); if(!k) return; (mapa[k]=mapa[k]||{nome:s.nome,emp:new Set()}).emp.add(c.dados.razao); }));
  if(S.empresa.dados) (S.empresa.dados.socios||[]).forEach(s=>{ const k=semAcento(s.nome).trim(); if(mapa[k]) mapa[k].emp.add("(sua empresa)"); });
  return Object.values(mapa).filter(x=>x.emp.size>1).map(x=>({nome:x.nome,empresas:[...x.emp]}));
}

/* ---------------- Markdown simples ---------------- */
function md(src){
  const lines=String(src||"").replace(/\r/g,"").split("\n"); let out=[], i=0;
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  while(i<lines.length){
    let l=lines[i];
    if(/^\s*\|.*\|\s*$/.test(l) && i+1<lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const row=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=row(l); i+=2; const body=[];
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ body.push(row(lines[i])); i++; }
      out.push(`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${inl(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue;
    }
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){ out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); i++; continue; }
    if(/^\s*(-{3,}|\*{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^\s*>\s?/.test(l)){ const b=[]; while(i<lines.length && /^\s*>\s?/.test(lines[i])){ b.push(lines[i].replace(/^\s*>\s?/,"")); i++; } out.push(`<blockquote>${b.map(inl).join("<br>")}</blockquote>`); continue; }
    if(/^\s*[-*•]\s+/.test(l)){ const b=[]; while(i<lines.length && /^\s*[-*•]\s+/.test(lines[i])){ b.push(lines[i].replace(/^\s*[-*•]\s+/,"")); i++; } out.push(`<ul>${b.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ const b=[]; while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ b.push(lines[i].replace(/^\s*\d+[.)]\s+/,"")); i++; } out.push(`<ol>${b.map(x=>`<li>${inl(x)}</li>`).join("")}</ol>`); continue; }
    if(!l.trim()){ i++; continue; }
    const p=[]; while(i<lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*>|\s*\|)/.test(lines[i])){ p.push(lines[i]); i++; }
    if(p.length) out.push(`<p>${p.map(inl).join("<br>")}</p>`); else { out.push(`<p>${inl(l)}</p>`); i++; }
  }
  return out.join("\n");
}

/* ---------------- PDF → texto ---------------- */
let pdfPronto=null;
function carregarPDFjs(){
  if(pdfPronto) return pdfPronto;
  const add=src=>new Promise((ok,err)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>err(new Error("Falha ao carregar leitor de PDF")); document.head.appendChild(s); });
  const base="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  pdfPronto = add(base+"pdf.min.js").then(()=>add(base+"pdf.worker.min.js")).then(()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.js"; });
  return pdfPronto;
}
async function lerArquivo(file, onProg){
  if(/\.pdf$/i.test(file.name) || file.type==="application/pdf"){
    await carregarPDFjs();
    const buf=await file.arrayBuffer();
    const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
    let txt=""; for(let p=1;p<=pdf.numPages;p++){ const pg=await pdf.getPage(p); const c=await pg.getTextContent(); txt+=`\n\n[Página ${p}]\n`+c.items.map(it=>it.str+(it.hasEOL?"\n":" ")).join(""); onProg&&onProg(p,pdf.numPages); }
    if(txt.replace(/\[Página \d+\]|\s/g,"").length<200) txt+="\n\n[AVISO: o PDF parece ser digitalizado (imagem). O texto pode estar incompleto — use um PDF pesquisável ou cole o texto.]";
    return txt.trim();
  }
  return await file.text();
}

function editarValidade(id){ const c=CERTS.find(x=>x.id===id), d=docDaCert(id);
  modal(`<h2>${esc(c.nome)}</h2><label>Válida até</label><input type="date" id="evData" value="${esc(d?.validade||"")}">${c.dias?`<div class="small muted" style="margin-top:6px">Normalmente vale ${c.dias} dias a partir da emissão.</div><button class="btn ghost sm" id="evHoje">Emiti hoje → validade de ${c.dias} dias</button>`:""}<div class="right"><button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="evOk">Salvar</button></div>`,m=>{

function renovarTudo(){
  const uf=CERT_UF||S.empresa.dados?.uf||"PA", mun=S.empresa.dados?.municipio||"";
  const pend=CERTS.filter(c=>["federal","fgts","cndt","estadual","municipal","falencia"].includes(c.id)).filter(c=>{ const [,d]=statusCert(docDaCert(c.id)); return d===null||d<=15; });
  modal(`<h2>Renovar certidões</h2><p class="small muted">Toque em cada uma, emita no site oficial (o CNPJ já está copiado), baixe o PDF e volte. No fim, envie todos os PDFs de uma vez na Central.</p>${pend.map((c,i)=>`<a class="btn sec" style="width:100%;justify-content:space-between;margin-top:8px" href="${esc(c.url(uf,mun))}" target="_blank" rel="noopener" onclick="copiarCNPJCert();this.style.opacity=.5;this.querySelector('span').textContent='✓ aberto'"><b>${i+1}. ${esc(c.nome)}</b><span>abrir ↗</span></a>`).join("")}<div class="right"><button class="btn" onclick="fecharModal();document.getElementById('central')?.scrollIntoView({behavior:'smooth'})">Concluí — enviar PDFs</button></div>`);
}
function lerValidade(txt){
  const t=txt.replace(/\s+/g," "); const datas=[]; const re=/(\d{2})[\/.](\d{2})[\/.](\d{4})/g;
  const perto=[]; const kw=/v[aá]lid[ao]? at[eé]|validade|v[aá]lida at[eé] o dia|prazo de validade|v[aá]lido at[eé]/gi; let k;
  while((k=kw.exec(t))){ const trecho=t.slice(k.index,k.index+140); let m; const r=new RegExp(re.source,"g"); while((m=r.exec(trecho))) perto.push(new Date(+m[3],+m[2]-1,+m[1])); }
  let m; while((m=re.exec(t))) datas.push(new Date(+m[3],+m[2]-1,+m[1]));
  const ok=a=>a.filter(d=>!isNaN(d)&&d.getFullYear()>2000&&d.getFullYear()<2100);
  const p=ok(perto); if(p.length) return p.sort((a,b)=>b-a)[0];
  const futuras=ok(datas).filter(d=>d>new Date()); return futuras.length?futuras.sort((a,b)=>b-a)[0]:null;
}
async function processarCertidoes(files){
  const meu=soDig(S.empresa.cnpj); const res=[];
  for(const f of files){
    try{ const txt=await lerArquivo(f); const tipo=["federal","fgts","cndt","falencia","tcu","simples","cnpj","junta","municipal","estadual"].map(i=>CERTS.find(c=>c.id===i)).find(c=>c.det.test(txt));
      const val=lerValidade(txt); const cnpjs=(txt.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g)||[]).map(soDig);
      const outro=meu&&cnpjs.length&&!cnpjs.some(c=>c===meu||c.slice(0,8)===meu.slice(0,8));
      if(tipo&&val){ const doc=garantirDoc(tipo.id); doc.validade=ymdL(val); doc.arquivo=f.name; doc.lidoEm=new Date().toISOString(); res.push(["ok",`<b>${esc(tipo.nome)}</b> — válida até <b>${fmtData(val)}</b>${outro?' <span class="chip bad">CNPJ diferente do seu!</span>':""}`]); }
      else if(tipo){ res.push(["warn",`<b>${esc(tipo.nome)}</b> — não achei a validade no PDF. Use o 📅 para informar.`]); }
      else res.push(["warn",`<b>${esc(f.name)}</b> — não reconheci o tipo de certidão${val?` (validade lida: ${fmtData(val)})`:""}. Informe pelo 📅 da certidão certa.`]);
    }catch(e){ res.push(["bad",`<b>${esc(f.name)}</b> — não consegui ler o PDF.`]); }
  }
  salvar(); render();
  modal(`<h2>Certidões lidas</h2>${res.map(([t,m])=>`<div class="flag ${t}"><div>${t==="ok"?"✅":t==="bad"?"⛔":"⚠️"}</div><div>${m}</div></div>`).join("")}<div class="small muted" style="margin-top:8px">Confira as datas: a leitura é automática e pode errar em PDFs fora do padrão.</div><div class="right"><button class="btn" onclick="fecharModal()">Ok</button></div>`);
}
function ligarCentral(){
  const d=$("#dCert"), f=$("#fCert"); if(!d) return;
  d.onclick=()=>f.click(); d.ondragover=e=>{e.preventDefault();}; d.ondrop=e=>{e.preventDefault();processarCertidoes([...e.dataTransfer.files]);};
  f.onchange=()=>{ d.innerHTML='<span class="small">Lendo certidões…</span>'; processarCertidoes([...f.files]); };
  const u=$("#certUf"); if(u) u.onchange=()=>{ CERT_UF=u.value; render(); setTimeout(()=>$("#central")?.scrollIntoView(),50); };
}

function filtrarRadar(todos,r){
  const ate=Date.now()+(+r.dias||30)*864e5, agora=Date.now();
  const termos=(r.palavras||"").split(",").map(s=>semAcento(s).trim()).filter(Boolean);
  const pos=termos.filter(k=>!k.startsWith("-")), neg=termos.filter(k=>k.startsWith("-")).map(k=>k.slice(1).trim()).filter(Boolean);
  const mun=semAcento(r.mun||""), vmin=+String(r.vmin||"").replace(/\D/g,"")||0;
  let fil=todos.filter(l=>{ const t=new Date(l.encerramento).getTime(); if(l.encerramento && (t<agora||t>ate)) return false;
    if(r.modalidade && l.mc!==undefined && String(l.mc)!==r.modalidade) return false;
    if(mun && semAcento(l.municipio)!==mun) return false;
    if(vmin && !(+l.valor>=vmin)) return false;
    const o=semAcento(l.objeto); if(neg.some(k=>o.includes(k))) return false; if(pos.length && !pos.some(k=>o.includes(k))) return false; return true; });
  const ad=l=>compatCNAE(l.objeto,S.empresa.dados,S.empresa.palavras).pts;
  if(r.ordem==="prazo") fil.sort((a,b)=>new Date(a.encerramento)-new Date(b.encerramento));
  else if(r.ordem==="valor") fil.sort((a,b)=>(+b.valor||0)-(+a.valor||0));
  else fil.sort((a,b)=>ad(b)-ad(a) || new Date(a.encerramento)-new Date(b.encerramento));
  return fil;
}

  for(let i=0;i<ufs.length;i++){ prog&&prog(i,ufs.length,ufs[i]); todos=todos.concat(await carregarUF(ufs[i])); }
  return todos;
}

      $("#rInfo").innerHTML=`<div class="flag ok" style="margin:0 0 6px"><div>🗂️</div><div>Base do PNCP de <b>${fmtDataHora(m.atualizado)}</b> · <b>${m.total.toLocaleString("pt-BR")}</b> licitações abertas no Brasil. Atualiza sozinha 3× ao dia. Os resultados mudam na hora conforme você mexe nos filtros.</div></div>`;
      await popMun(); if(r.uf || (r.ultimos||[]).length===0) filtrar();
    } else {
      $("#rBuscar").classList.remove("hide"); $("#rPagBox").classList.remove("hide"); await popMun();
      $("#rBuscar").onclick=buscarAoVivo;

    const fim=new Date(Date.now()+(+r.dias)*864e5); const pags=+r.paginas||3; let todos=[], erro=null;

      let url=`https://pncp.gov.br/api/consulta/v1/contratacoes/proposta?dataFinal=${ymd(fim)}&pagina=${p}&tamanhoPagina=50`;
      if(r.modalidade) url+=`&codigoModalidadeContratacao=${r.modalidade}`; if(r.uf) url+=`&uf=${r.uf}`;
      try{ const j=await fetchJSON(url,60000); if(j.__vazio) break; const arr=j.data||[]; todos=todos.concat(arr.map(normPNCP)); if(j.totalPaginas && p>=j.totalPaginas) break; if(!arr.length) break; }

/* ================= DATAS / DIAS ÚTEIS ================= */
function pascoa(y){ const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return new Date(y,mes-1,dia); }
const _fer={};
function feriados(y){ if(_fer[y]) return _fer[y]; const s=new Set(["01-01","04-21","05-01","09-07","10-12","11-02","11-15","11-20","12-25"].map(x=>y+"-"+x)); const p=pascoa(y); [-48,-47,-2,60].forEach(n=>{ const d=new Date(p); d.setDate(d.getDate()+n); s.add(ymdL(d)); }); return _fer[y]=s; }
function ymdL(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ehUtil(d){ const w=d.getDay(); return w!==0 && w!==6 && !feriados(d.getFullYear()).has(ymdL(d)); }
function somaUteis(data,n){ const d=new Date(data); if(isNaN(d)) return null; d.setHours(12,0,0,0); let c=0; const st=n<0?-1:1; while(c<Math.abs(n)){ d.setDate(d.getDate()+st); if(ehUtil(d)) c++; } return d; }
function prazosLic(l){
  const ev=[]; const ses=l.sessao||l.encerramento;
  if(ses){ const d=new Date(ses); if(!isNaN(d)){
    ev.push({data:somaUteis(d,-3),titulo:"Último dia p/ impugnar ou pedir esclarecimento",tipo:"imp",info:"art. 164 da Lei 14.133 — até 3 dias úteis antes da abertura"});
    ev.push({data:d,titulo:"Sessão pública / disputa de lances",tipo:"ses",info:l.plataforma?("Plataforma: "+l.plataforma):""}); } }
  if(l.resultadoData){ const r=somaUteis(l.resultadoData,3); ev.push({data:r,titulo:"Prazo das razões de recurso",tipo:"rec",info:"art. 165 — 3 dias úteis da intimação/ata (registre a intenção na sessão)"});
    ev.push({data:somaUteis(r,3),titulo:"Prazo de contrarrazões (aprox.)",tipo:"con",info:"3 dias úteis após o fim do prazo do recorrente"}); }
  return ev.filter(e=>e.data).map(e=>({...e,lic:l}));
}
const TIPO_EV={imp:["⚖️","warn"],ses:["🔨","blue"],rec:["📨","bad"],con:["🛡️",""],doc:["📄","warn"]};

  <div class="grid g2" style="align-items:start"><div class="stack">

function calcDisputa(l){
  const ds=l.disputa||{}; const n=k=>+String(ds[k]??"").replace(/\./g,"").replace(",",".")||0;
  const custo=n("custo"), ind=n("ind")/100, trib=n("trib")/100, mar=n("mar")/100, mmin=n("marMin")/100;
  if(!custo) return null; const base=custo*(1+ind);
  const ideal=(1-trib-mar)>0?base/(1-trib-mar):null, piso=(1-trib-mmin)>0?base/(1-trib-mmin):null;
  return {base,ideal,piso,est:+l.valor||0};
}
function calcDisputaHTML(l){
  const c=calcDisputa(l); if(!c) return '<div class="muted small">Preencha ao menos o custo direto.</div>';
  const desc=v=>{ if(!c.est||!v) return ""; const pc=(1-v/c.est)*100; return ` <span class="small muted">(${Math.abs(pc).toFixed(1).replace(".",",")}% ${pc>=0?"abaixo":"acima"} do estimado)</span>`; };
  const alerta=c.est&&c.piso&&c.piso>c.est?`<div class="flag bad"><div>⛔</div><div>Seu piso fica <b>acima do valor estimado</b> pelo órgão. Reveja custos ou avalie se vale participar.</div></div>`:"";
  const inex=c.est&&c.piso&&c.piso<c.est*0.75?`<div class="flag warn"><div>⚠️</div><div>O piso está abaixo de 75% do estimado — em obras e serviços de engenharia isso é presumido inexequível (art. 59 §4º). Tenha a planilha pronta para justificar.</div></div>`:"";
  return `<div class="grid g3"><div class="card kpi" style="box-shadow:none"><div class="lbl">Custo + indiretas</div><div class="val" style="font-size:18px">${brl(c.base)}</div></div><div class="card kpi" style="box-shadow:none;border-color:#bbf7d0"><div class="lbl">Preço ideal</div><div class="val" style="font-size:18px;color:var(--ok)">${c.ideal?brl(c.ideal):"—"}</div></div><div class="card kpi" style="box-shadow:none;border-color:#fecaca"><div class="lbl">Piso de lance</div><div class="val" style="font-size:18px;color:var(--bad)">${c.piso?brl(c.piso):"—"}</div></div></div>
  <div class="small" style="margin-top:8px">Ideal${desc(c.ideal)} · Piso${desc(c.piso)}</div>${alerta}${inex}`;
}

function togCk(lid,cid,v){ const l=S.licitacoes.find(x=>x.id===lid); const c=l.checklist.find(x=>x.id===cid); c.ok=v; salvar(); render(); }
function delCk(lid,cid){ const l=S.licitacoes.find(x=>x.id===lid); l.checklist=l.checklist.filter(x=>x.id!==cid); salvar(); render(); }
function addCk(lid){ const t=$("#ckNovo").value.trim(); if(!t) return; const l=S.licitacoes.find(x=>x.id===lid); (l.checklist=l.checklist||[]).push({id:uid(),txt:t,ok:false}); salvar(); render(); }
function gerarCk(lid,tipo){ const l=S.licitacoes.find(x=>x.id===lid); l.checklist=l.checklist||[]; const ex=new Set(l.checklist.map(x=>x.txt));

      catch(e){ toast("Não consegui ler "+file.name+": "+e.message); }

async function iaChamar(prompt,onText){
  if(sampleFn){ const r=await sampleFn(prompt,{modelTier:"complex",onText}); return {text:r.text||"",truncated:r.truncated}; }
  const key=S.cfg?.apiKey; if(!key) throw new Error("sem chave");
  const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:S.cfg.modelo||"claude-sonnet-5-5",max_tokens:16000,stream:true,messages:[{role:"user",content:prompt}]})});
  if(!resp.ok){ let m="HTTP "+resp.status; try{ const j=await resp.json(); m=j.error?.message||m; }catch(e){} throw new Error(m); }
  const rd=resp.body.getReader(), dec=new TextDecoder(); let buf="", text="", stop="";
  while(true){ const {value,done}=await rd.read(); if(done) break; buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf("\n"))>=0){ const ln=buf.slice(0,i).trim(); buf=buf.slice(i+1); if(!ln.startsWith("data:")) continue; try{ const j=JSON.parse(ln.slice(5)); if(j.type==="content_block_delta"&&j.delta?.text){ text+=j.delta.text; onText&&onText({text}); } if(j.type==="message_delta") stop=j.delta?.stop_reason||stop; }catch(e){} } }
  return {text,truncated:stop==="max_tokens"};
}

    let txt=res.text||"";

      if(v){ AN.resultado={tipo:"json",valor:v}; const l=S.licitacoes.find(x=>x.id===AN.licId); if(l){ l.analise=v; if(l.status==="analise"||!l.status) l.status={apta:"apta",apta_com_pendencias:"pendencias",inapta:"inapta"}[v.veredito]||l.status; salvar(); } }
      else AN.resultado={tipo:"md",valor:txt};
    } else { AN.resultado={tipo:"md",valor:txt}; const l=S.licitacoes.find(x=>x.id===AN.licId); if(l){ (l.docsGerados=l.docsGerados||[]).push({tipo:AN.modo,em:new Date().toISOString(),texto:txt.slice(0,60000)}); salvar(); } }
    if(res.truncated) toast("A resposta foi cortada por tamanho — peça novamente ou use Copiar prompt.");
  }catch(e){

  }
  AN.busy=false; render();
}

  if(CFG_ABA==="seguranca") corpo=`<div class="card"><h2>🔒 PIN de acesso</h2><p class="small muted" style="margin-top:-6px">Protege o app neste aparelho com um PIN de 4 a 8 números. Esquecer o PIN obriga a apagar os dados (ou restaurar um backup).</p>
    ${c.pinHash?`<div class="flag ok"><div>✅</div><div>PIN ativo.</div></div>`:""}
    <div class="grid g2"><div><label>${c.pinHash?"Novo PIN":"Crie um PIN"}</label><input id="pin1" type="password" inputmode="numeric" maxlength="8" placeholder="••••"></div><div><label>Repita o PIN</label><input id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="••••"></div></div>
    <label>Bloquear sozinho depois de</label><select id="autoBloq">${[["0","Nunca"],["5","5 minutos sem uso"],["15","15 minutos sem uso"],["30","30 minutos sem uso"],["60","1 hora sem uso"]].map(([k,n])=>`<option value="${k}" ${String(c.autoBloq||"0")===k?"selected":""}>${n}</option>`).join("")}</select>
    <div class="right" style="justify-content:flex-start"><button class="btn sm" id="pinSalvar">${c.pinHash?"Trocar PIN":"Ativar PIN"}</button>${c.pinHash?'<button class="btn ghost sm" id="pinRemover">Remover PIN</button>':""}</div>
    <p class="small muted">O PIN impede que outra pessoa abra o app no seu celular. Ele não substitui um login online.</p></div>`;
  if(CFG_ABA==="prefs") corpo=`<div class="card"><h2>🎨 Preferências</h2><div class="grid g2">
    <div><label>Tema</label><select data-cf="tema">${[["claro","☀️ Claro"],["escuro","🌙 Escuro"],["auto","Automático (segue o celular)"]].map(([k,n])=>`<option value="${k}" ${(c.tema||"claro")===k?"selected":""}>${n}</option>`).join("")}</select></div>
    <div><label>Tamanho da letra</label><select data-cf="fonte">${[["normal","Normal"],["grande","Grande"]].map(([k,n])=>`<option value="${k}" ${(c.fonte||"normal")===k?"selected":""}>${n}</option>`).join("")}</select></div>
    <div><label>Tela inicial ao abrir</label><select data-cf="inicio">${PAGINAS.filter(x=>x[0]!=="config").map(([k,n])=>`<option value="${k}" ${(c.inicio||"painel")===k?"selected":""}>${n}</option>`).join("")}</select></div>
    <div><label>Avisar certidões com antecedência de</label><select data-cf="alertaDias">${["7","15","20","30"].map(k=>`<option value="${k}" ${String(c.alertaDias||"20")===k?"selected":""}>${k} dias</option>`).join("")}</select></div>
    <div><label>Estado padrão do Radar</label><select data-rd="uf"><option value="">Brasil inteiro</option>${UFS.map(u=>`<option ${u===S.radar.uf?"selected":""}>${u}</option>`).join("")}</select></div>
    <div><label>Palavras-chave padrão</label><input data-rd="palavras" value="${esc(S.radar.palavras||S.empresa.palavras||"")}"></div>
    </div><div class="right" style="justify-content:flex-start"><button class="btn sec sm" onclick="abrirBoasVindas()">Rever tela de boas-vindas</button></div></div>`;
  if(CFG_ABA==="ia") corpo=`<div class="card"><h2>✨ IA dentro do site</h2>
   <p class="small muted" style="margin-top:-6px">Para a análise rodar aqui (sem copiar e colar), cole uma chave da API da Anthropic. Ela fica salva só neste aparelho. O uso é cobrado pela Anthropic na sua conta — normalmente centavos a poucos reais por edital. Não use em aparelho compartilhado.</p>
   ${c.apiKey?`<div class="flag ok"><div>✅</div><div>Chave configurada — a IA roda dentro do site.</div></div>`:""}
   <div class="row"><div><label>Chave da API</label><input id="cfgKey" type="password" placeholder="sk-ant-..." value="${esc(c.apiKey||"")}"></div><div><label>Modelo</label><select id="cfgMod">${[["claude-sonnet-5-5","Sonnet (recomendado)"],["claude-opus-5-5","Opus (mais profundo, mais caro)"],["claude-haiku-5-5","Haiku (rápido, mais barato)"]].map(([k,n])=>`<option value="${k}" ${k===c.modelo?"selected":""}>${n}</option>`).join("")}</select></div></div>
   <div class="right" style="justify-content:flex-start"><button class="btn sm" id="cfgSalvar">Salvar chave</button>${c.apiKey?'<button class="btn ghost sm" id="cfgLimpar">Remover chave</button>':""}<a class="btn ghost sm" href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Criar chave ↗</a></div></div>`;
  if(CFG_ABA==="dados") corpo=`<div class="card"><h2>💾 Backup</h2><p class="small muted" style="margin-top:-6px">Tudo fica salvo neste aparelho (${(tam/1024).toFixed(0)} KB). ${c.ultimoBackup?`Último backup: <b>${fmtDataHora(c.ultimoBackup)}</b>.`:"<b>Você ainda não fez nenhum backup.</b>"}</p>
   <div class="row"><button class="btn fit" id="bExp">Baixar backup (.json)</button><button class="btn sec fit" id="bCop">Copiar backup</button></div>
   <h3>Restaurar</h3><div class="drop" id="dImp"><b>Enviar arquivo de backup</b><input type="file" accept=".json" class="hide" id="fImp"></div>
   <label>…ou cole o conteúdo do backup</label><textarea id="tImp" style="min-height:70px"></textarea><div class="right"><button class="btn sec sm" id="bImp">Restaurar do texto</button></div></div>
   <div class="card" style="margin-top:16px"><h2>📊 Exportar para planilha</h2><p class="small muted" style="margin-top:-6px">Arquivos .csv que abrem no Excel ou Google Planilhas.</p>
   <div class="row"><button class="btn sec fit" onclick="exportarCSV('licitacoes')">Minhas licitações</button><button class="btn sec fit" onclick="exportarCSV('prazos')">Prazos</button><button class="btn sec fit" onclick="exportarCSV('certidoes')">Certidões</button><button class="btn sec fit" onclick="exportarCSV('concorrentes')">Concorrentes</button></div></div>
   <div class="card" style="margin-top:16px;border-color:#fecaca"><h2>Zona de perigo</h2><button class="btn danger sm" onclick="confirmar('Apagar TODOS os dados deste aparelho? Faça backup antes.',()=>{S=vazio();salvar();render();toast('Dados apagados');})">Apagar todos os dados</button></div>`;
  if(CFG_ABA==="sobre") corpo=`<div class="card"><h2>ℹ️ Sobre</h2><dl class="dl small">
   <dt>Versão</dt><dd>LicitaRadar ${VERSAO}</dd>
   <dt>Licitações</dt><dd>PNCP — API pública de consultas, coletada 3× ao dia</dd>
   <dt>Contratos (Mercado)</dt><dd>PNCP — contratos assinados, somente fornecedores com CNPJ</dd>
   <dt>CNPJ</dt><dd>Dados abertos da Receita Federal (BrasilAPI, Minha Receita, CNPJ.ws)</dd>
   <dt>IA</dt><dd>${sampleFn?"Integrada (Claude)":c.apiKey?"Chave própria (API Anthropic)":"Copiar e colar no Claude"}</dd>
   <dt>Base legal</dt><dd>Lei 14.133/2021 · LC 123/2006 · jurisprudência do TCU</dd>
   <dt>Seus dados</dt><dd>Ficam só neste aparelho; nada é enviado ao repositório público</dd></dl>
   <div class="flag warn" style="margin-top:12px"><div>⚖️</div><div class="small">As análises e minutas geradas pela IA são apoio e precisam de revisão por advogado ou responsável antes do protocolo.</div></div></div>`;
  return header("Ajustes","Conta, segurança, preferências, IA e seus dados.")+
  `<div class="tabs">${abas.map(([k,n])=>`<button class="${k===CFG_ABA?"on":""}" onclick="CFG_ABA='${k}';render()">${n}</button>`).join("")}</div>${corpo}`;
}
function posConfig(){
  const c=S.cfg; const on=(id,fn)=>{ const e=$(id); if(e) e.onclick=fn; };
  on("#pfSalvar",()=>{ c.perfil=c.perfil||{}; document.querySelectorAll("[data-pf]").forEach(i=>c.perfil[i.dataset.pf]=i.value.trim()); salvar(); toast("Perfil salvo ✔"); });
  on("#bBloq",()=>bloquear());
  on("#bSair",()=>confirmar("Sair deste aparelho? Vou baixar um backup e depois apagar todos os dados daqui.",()=>{ backupBaixar(); setTimeout(()=>{ try{ localStorage.removeItem(STORE_KEY); }catch(e){} S=vazio(); location.hash=""; location.reload(); },1200); }));
  on("#pinSalvar",async()=>{ const a=$("#pin1").value, b=$("#pin2").value; if(a||b){ if(!/^\d{4,8}$/.test(a)){ toast("O PIN deve ter de 4 a 8 números"); return; } if(a!==b){ toast("Os PINs não conferem"); return; } c.pinHash=await hashPIN(a); c.pinLen=a.length; }
    c.autoBloq=$("#autoBloq").value; salvar(); render(); toast(c.pinHash?"PIN ativo 🔒":"Preferência salva"); });
  on("#pinRemover",()=>confirmar("Remover o PIN deste aparelho?",()=>{ c.pinHash=""; c.autoBloq="0"; salvar(); render(); toast("PIN removido"); }));
  const ab=$("#autoBloq"); if(ab) ab.onchange=()=>{ c.autoBloq=ab.value; salvar(); toast("Salvo"); };
  document.querySelectorAll("[data-cf]").forEach(i=>i.onchange=()=>{ c[i.dataset.cf]=i.value; salvar(); aplicarPrefs(); toast("Preferência salva"); });
  document.querySelectorAll("[data-rd]").forEach(i=>i.onchange=()=>{ S.radar[i.dataset.rd]=i.value; if(i.dataset.rd==="uf") S.radar.mun=""; S.radar.ultimos=[]; salvar(); toast("Salvo"); });
  on("#cfgSalvar",()=>{ c.apiKey=$("#cfgKey").value.trim(); c.modelo=$("#cfgMod").value; salvar(); render(); toast(c.apiKey?"Chave salva — a IA agora roda dentro do site":"Chave removida"); });
  on("#cfgLimpar",()=>{ c.apiKey=""; salvar(); render(); toast("Chave removida"); });
  on("#bExp",()=>backupBaixar()); on("#bCop",()=>{ copiar(dumpBackup()); c.ultimoBackup=new Date().toISOString(); salvar(); });
  const restaurar=txt=>{ try{ const j=JSON.parse(txt); const d=j.dados||j; if(!d.empresa||!d.licitacoes) throw new Error("formato"); S=Object.assign(vazio(),d); S.cfg=Object.assign(vazio().cfg,S.cfg||{}); salvar(); aplicarPrefs(); render(); toast("Backup restaurado ✔"); }catch(e){ toast("Arquivo de backup inválido"); } };
  on("#dImp",()=>$("#fImp").click()); const fi=$("#fImp"); if(fi) fi.onchange=async()=>{ const f=fi.files[0]; if(f) restaurar(await f.text()); };
  on("#bImp",()=>restaurar($("#tImp").value));
}
const dumpBackup=()=>JSON.stringify({app:"LicitaRadar",versao:VERSAO,exportadoEm:new Date().toISOString(),dados:S},null,1);
function backupBaixar(){ baixar(`licitaradar-backup-${new Date().toISOString().slice(0,10)}.json`,dumpBackup(),"application/json"); S.cfg.ultimoBackup=new Date().toISOString(); salvar(); }
function exportarCSV(tipo){
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`; let cab=[], rows=[];
  if(tipo==="licitacoes"){ cab=["Objeto","Órgão","Cidade","UF","Valor estimado","Modalidade","Sessão/encerramento","Status","Plataforma","Link"]; rows=S.licitacoes.map(l=>[limpaObj(l.objeto),l.orgao,l.municipio,l.uf,l.valor,l.modalidade,fmtDataHora(l.sessao||l.encerramento),(STATUS[l.status||"analise"]||[""])[0],l.plataforma||"",l.link||""]); }
  if(tipo==="prazos"){ cab=["Data","Prazo","Licitação/Documento","Observação"]; rows=eventosTodos().map(e=>[fmtData(e.data),e.titulo,e.lic?limpaObj(e.lic.objeto):"",e.info]); }
  if(tipo==="certidoes"){ cab=["Documento","Validade","Dias restantes","Arquivo"]; rows=S.empresa.docs.map(d=>[d.nome,d.validade?fmtData(d.validade):"",d.validade?diasAte(d.validade):"",d.arquivo||""]); }
  if(tipo==="concorrentes"){ cab=["Razão social","CNPJ","Situação","Porte","Abertura","Capital social","Cidade/UF","Anotações"]; rows=S.concorrentes.map(c=>{const d=c.dados||{};return [d.razao,fmtCNPJ(c.cnpj),d.situacao,d.porte,fmtData(d.abertura),d.capital,(d.municipio||"")+"/"+(d.uf||""),c.notas]}); }
  if(!rows.length){ toast("Nada para exportar ainda"); return; }
  baixar(`licitaradar-${tipo}-${new Date().toISOString().slice(0,10)}.csv`,"﻿"+[cab,...rows].map(r=>r.map(q).join(";")).join("\r\n"),"text/csv");
}
/* ---- bloqueio por PIN ---- */
let ultimaAtividade=Date.now(), bloqueado=false;
function bloquear(){
  if(!S.cfg.pinHash) return; bloqueado=true;
  $("#layer").innerHTML=`<div class="ob-bg" style="z-index:120"><div class="ob-card" style="text-align:center;max-width:360px"><div class="logo-big"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div>
   <h2 style="margin:14px 0 4px">LicitaRadar bloqueado</h2><p class="small muted" style="margin:0 0 14px">${esc(S.cfg.perfil?.nome?("Olá, "+S.cfg.perfil.nome.split(" ")[0]+". "):"")}Digite seu PIN para continuar.</p>
   <input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off" style="text-align:center;font-size:26px;letter-spacing:10px;padding:14px" placeholder="••••">
   <div id="pinMsg" class="small" style="color:var(--bad);min-height:20px;margin-top:6px"></div>
   <button class="btn" id="pinOk" style="width:100%;padding:13px">Desbloquear</button>
   <button class="btn ghost sm" style="margin-top:10px" id="pinEsq">Esqueci o PIN</button></div></div>`;
  const inp=$("#pinIn"); setTimeout(()=>inp.focus(),100);
  const tentar=async()=>{ if(await hashPIN(inp.value)===S.cfg.pinHash){ bloqueado=false; ultimaAtividade=Date.now(); fecharModal(); toast("Bem-vindo de volta"); } else { $("#pinMsg").textContent="PIN incorreto"; inp.value=""; inp.focus(); } };
  $("#pinOk").onclick=tentar; inp.onkeydown=e=>{ if(e.key==="Enter") tentar(); }; inp.oninput=()=>{ if(inp.value.length>=4 && inp.value.length===(S.cfg.pinLen||0)) tentar(); };
  $("#pinEsq").onclick=()=>{ $("#pinMsg").innerHTML=`Sem o PIN, a única saída é apagar os dados deste aparelho (depois você pode restaurar um backup). <button class="btn danger sm" style="margin-top:8px" id="pinApagar">Apagar dados e entrar</button>`; $("#pinApagar").onclick=()=>{ try{ localStorage.removeItem(STORE_KEY); }catch(e){} location.hash=""; location.reload(); }; };
}
["click","keydown","touchstart","scroll"].forEach(ev=>window.addEventListener(ev,()=>{ ultimaAtividade=Date.now(); },{passive:true}));
setInterval(()=>{ const m=+(S.cfg?.autoBloq||0); if(m && S.cfg.pinHash && !bloqueado && Date.now()-ultimaAtividade>m*60000) bloquear(); },20000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ const m=+(S.cfg?.autoBloq||0); if(m && S.cfg.pinHash && !bloqueado && Date.now()-ultimaAtividade>m*60000) bloquear(); } });


if(!location.hash && S.cfg.inicio && PAGINAS.some(p=>p[0]===S.cfg.inicio)) pagina=S.cfg.inicio;
aplicarPrefs();
render();
if(S.cfg.pinHash) bloquear(); else if(!S.intro && !S.empresa.dados) abrirBoasVindas();
</script>
</body>
</html>
